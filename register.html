<!-- HTML5 document declaration -->
<!DOCTYPE html>

<!-- Root HTML element -->
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive layout for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>User Registration</title>

    <!-- Link to external CSS -->
    <link rel="stylesheet" href="CSS/styles.css">

</head>

<body class="section-body">

<!-- Registration container -->
<div class="login-container">

<h2>User Registration</h2>

<!-- Registration form -->
<form id="registerForm" method="post" autocomplete="off">

<!-- Name label -->
<label>Full Name</label>

<!-- Name input -->
<input class="input-field" type="text" id="name" placeholder="Enter your full name">

<!-- Email label -->
<label>Email</label>

<!-- Email input -->
<input class="input-field" type="email" id="email" placeholder="Enter your email">

<!-- Password label -->
<label>Password</label>

<!-- Password input -->
<input class="input-field" type="password" id="password" placeholder="Enter password">

<!-- Confirm Password label -->
<label>Confirm Password</label>
<input class="input-field" type="password" id="confirmPassword" placeholder="Confirm your password">

<!-- Role selection -->
<label>Select Role</label>

<select class="input-field" id="role">

<option value="user">User</option>

<option value="restaurant">Restaurant</option>
<option value="Admin">Admin</option>

</select>

<!-- Submit button -->
<button class="input-field" type="submit">Register</button>

</form>
<p>have an account ? <a href="login.html">login here</a></p>

<br>

<!-- Validation message -->
<p id="message"></p>

</div>

<script src="javascript/scripts.js"></script>

</body>
</html>
