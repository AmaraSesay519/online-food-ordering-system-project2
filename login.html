<!-- Declares that this document uses HTML5 -->
<!DOCTYPE html>

<!-- Root HTML element with language set to English -->
<html lang="en">

<head>


    <!-- Defines the character encoding for the page -->
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed in the browser tab -->
    <title>Role Based Login</title>

    <!-- Link to the external CSS stylesheet -->
    <link rel="stylesheet" href="CSS/styles.css">

</head>

<body class="section-body">

<section >

    <!-- Main container that holds the login form -->
    <div class="login-container">

        <!-- Main heading of the system -->
        <h2>🥧Online Food Ordering System</h2>

        <!-- Sub heading describing the page purpose -->
        <h3>Login to Your Account</h3>

        <!-- Login form -->
        <form id="loginForm" method="post" autocomplete="off">

            <!-- Label describing the email input field -->
            <label for="email">Email:</label>

            <!-- Input field for entering email -->
            <input 
                class="input-field" 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Enter your email"
                required
            >

            <!-- Label describing the password field -->
            <label for="password">Password:</label>

            <!-- Password input field -->
            <input 
                class="input-field" 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password"
                required
            >

            <!-- Label for selecting the login role -->
            <label for="role">Select Role:</label>

            <!-- Dropdown menu for choosing user role -->
            <select class="input-field" id="role" name="role">

                <!-- Normal customer account -->
                <option value="user">User</option>

                <!-- Restaurant owner account -->
                <option value="restaurant">Restaurant</option>

                <!-- Administrator account -->
                <option value="admin">Admin</option>

            </select>

            <!-- Login button that submits the form -->
            <button class="btn-primary" type="submit">
                Login
            </button>

        </form>

        <!-- Link for users who don't have an account -->
        <p>
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

        <!-- Area for displaying login messages or validation errors -->
        <p id="message"></p>

    </div>

    <!-- Link to external JavaScript file -->
    <script src="javascript/scripts.js"></script>
</section>
</body>

</html>
